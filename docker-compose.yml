services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: career-assistant-backend
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: career-assistant-frontend
    ports:
      - "5173:80"